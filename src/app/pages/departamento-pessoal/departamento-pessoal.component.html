<div class="modern-section bg-light section-padding">
  <ion-grid fixed>
    <ion-row class="ion-justify-content-center ion-text-center">
      <ion-col size="12" size-md="8">
        <div class="context-content slide-up-fade-1">
          <h2 class="display-title">Departamento Pessoal</h2>
          <p class="lead-text">
            Cuidamos de toda a burocracia trabalhista para que você foque exclusivamente na gestão de talentos e resultados.
          </p>
        </div>
      </ion-col>
    </ion-row>

    <ion-row class="ion-margin-top slide-up-fade-2">
      <div class="dp-bento-grid">
        @for (item of items; track item.id; let i = $index) {
          <div
            class="bento-item"
            [class.highlight-card]="selectedCardIndex() === i"
            (click)="selectCard(i)"
          >
            <div class="icon-box">
              <ion-icon [name]="item.icon"></ion-icon>
            </div>
            <h3>{{ item.title }}</h3>
            <p>{{ item.description }}</p>
          </div>
        }
      </div>
    </ion-row>
  </ion-grid>
</div>
